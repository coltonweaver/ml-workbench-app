[project]
name = "workbench-sidecar"
version = "0.1.0"
description = "Python side of ML Workbench: runs the learner's Jupyter kernel and test suites, speaks JSON lines over stdio."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
    "numpy>=2.0",
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workbench_sidecar", "workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
