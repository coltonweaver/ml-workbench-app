name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar:
    name: Python sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: swift build
      - name: Test (includes the real sidecar)
        run: swift test
        env:
          WORKBENCH_INTEGRATION: "1"
